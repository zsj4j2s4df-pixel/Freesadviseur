<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006bd5">
  <meta name="description" content="Praktische hulp voor EZ-MILL Express en EZ-DNC Express.">
  <title>Freesadviseur</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Hoofdnavigatie">
      <a class="brand" href="#vraag" aria-label="Freesadviseur start"><span class="brand-icon">F</span><span>Freesadviseur</span></a>
      <nav class="nav-list" id="side-nav"></nav>
      <div class="sidebar-note">Praktische hulp bij programmeren en frezen.</div>
    </aside>
    <main id="main" tabindex="-1">
      <header class="mobile-header"><span class="brand-icon">F</span><span>Freesadviseur</span></header>
      <section class="screen active" id="screen-vraag" data-screen="vraag"></section>
      <section class="screen" id="screen-uitleg" data-screen="uitleg"></section>
      <section class="screen" id="screen-waarden" data-screen="waarden"></section>
      <section class="screen" id="screen-geschiedenis" data-screen="geschiedenis"></section>
      <section class="screen" id="screen-info" data-screen="info"></section>
    </main>
    <nav class="tabbar" id="tab-nav" aria-label="Hoofdnavigatie"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="answer-dialog" class="answer-dialog" aria-labelledby="answer-title">
    <div class="dialog-head"><div><p class="eyebrow">Advies</p><h2 id="answer-title">Antwoord</h2></div><button class="icon-button" id="close-answer" aria-label="Sluiten">×</button></div>
    <div id="answer-content" class="answer-content"></div>
  </dialog>
</body>
</html>
